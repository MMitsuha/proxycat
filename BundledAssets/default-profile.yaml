# ProxyCat default profile template.
#
# Add your own proxies / proxy-groups below. Without remote proxies this
# profile still validates and connects, but all traffic uses DIRECT.
#
# The Network Extension overrides the TUN fd and a few TUN fields at
# runtime; the values here are copied from the sample profile so the
# editor starts from a known-good configuration.

mode: rule
log-level: info
ipv6: true
allow-lan: false
mixed-port: 7890
external-controller: 127.0.0.1:9090

tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  mtu: 1500

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# MITM is disabled by default. Turn it on from Profiles → swipe → MITM,
# or edit this block directly.
mitm:
  enable: false
  domain: []
  ports:
    - 80
    - 443
  encrypted-sni-policy: skip
  rules: []

# DIRECT is built in; add your own proxies and list them here.
proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - MATCH,Proxy
